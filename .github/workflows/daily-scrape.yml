name: Daily 10 PM News Scrape

on:
  schedule:
    # Runs at 22:00 UTC (10:00 PM GMT / Ghana Time) every night
    - cron: '0 22 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Daily Scraper
        run: node -e "import('./server/scraper.js').then(m => m.scrapeDailyNews())"

      - name: Build Web App
        run: npm run build

      - name: Commit and Push Updated News
        run: |
          git config --global user.name "newslet-bot"
          git config --global user.email "bot@newslet.local"
          git add server/data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update daily news [10:00 PM GMT]"
            git push
          fi
